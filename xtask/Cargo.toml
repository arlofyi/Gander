[package]
name = "xtask"
description = "Repository automation: preflight, icons, test-all, vectors-check, check-elf-alignment, e2e-host, e2e-android, e2e-stream, mockups, installer-check, installer-build, notices, sbom, docs-check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# Deterministic SBOM serial number (sbom.rs); already in the tree through the host.
blake3.workspace = true
# The `.dep-v0` zlib payload (host/build-support/auditable.rs is compiled into this crate too).
flate2.workspace = true
png.workspace = true
resvg.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
# Cargo.lock reader for the SBOM hashes.
toml.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
