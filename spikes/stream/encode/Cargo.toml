[package]
name = "spike-encode"
description = "WP-42 spike: Media Foundation H.264/HEVC hardware encoder fed from WGC capture textures; measures ms/frame and bitrate per adapter, writes Annex-B dumps for WP-43."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spike_encode"
path = "src/lib.rs"

[[bin]]
name = "spike-encode"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
spike-capture.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
