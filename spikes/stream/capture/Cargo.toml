[package]
name = "spike-capture"
description = "WP-41 spike: capture one HWND with Windows Graphics Capture into D3D11 textures on a caller-chosen device; measures the stream-spike matrix."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spike_capture"
path = "src/lib.rs"

[[bin]]
name = "spike-capture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gander-testwin.workspace = true

[target.'cfg(windows)'.dependencies]
# Comparison backend only (C1 "windows-capture" row); the own wrapper in src/wgc.rs is the path
# forward because the library creates its own device on the default adapter.
windows-capture.workspace = true
windows-future.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
