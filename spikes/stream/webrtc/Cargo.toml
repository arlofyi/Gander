[package]
name = "spike-webrtc"
description = "WP-43 spike: sends the WP-42 hardware-encoded H.264 as a WebRTC track (webrtc-rs 0.21, host candidates on loopback only, GCC driving the encoder bitrate), echoes input JSON on a data channel, signals over a plain WebSocket, and receives and decodes on a loopback peer in the same process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spike_webrtc"
path = "src/lib.rs"

[[bin]]
name = "spike-webrtc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
webrtc.workspace = true
rtc.workspace = true
async-trait.workspace = true
bytes.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
spike-capture.workspace = true
spike-encode.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
