[package]
name = "spike-input"
description = "WP-44 spike: streams a gander-testwin window to the Android spike app over WebRTC, maps the phone's normalised taps into the window and injects them with SendInput and PostMessage; also runs the input matrix (C19, C20, C3 mapping) without a phone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spike-input"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
spike-webrtc.workspace = true

[target.'cfg(windows)'.dependencies]
spike-capture.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
