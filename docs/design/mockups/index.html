<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gander UI Mockups</title>
<meta name="description" content="Clickable mockups of the Gander UI redesign: Android phone and tablet client, Windows host tray and settings app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (see docs/design/2026-11-02-ui-redesign.md) ---------- */
:root{
  --ink:#1d2a30; --beak:#e2682a; --paper:#f4f2ec;
  --bg:#f3f4f2; --surface:#fbfbfa; --s2:#eceeec; --s3:#e3e7e5;
  --line:#d6dbda; --outline:#7e8b91;
  --text:#1d2a30; --text2:#46555c; --text3:#5f6e75;
  --accent:#e2682a; --on-accent:#170d06; --accent-text:#a8460f;
  --accent-c:#fbe3d4; --on-accent-c:#5a2206;
  --primary:#1d2a30; --on-primary:#ffffff;
  --danger:#b3261e; --on-danger:#ffffff; --ok:#2e7d4f; --ok-c:#dcefe2; --warn:#8a6100; --warn-c:#f6e7c4; --bad:#b3261e; --bad-c:#f9dedc;
  --scrim:rgba(17,23,25,.42);
  /* Windows host */
  --mica:#eef0ef; --layer:#fbfbfa; --layer2:#f6f7f6; --wstroke:rgba(29,42,48,.10); --wstroke2:rgba(29,42,48,.16);
  --desk:#c9d0cd; --taskbar:rgba(238,240,239,.96);
  --lens-bg:var(--surface);
  /* mockup page chrome */
  --page:#e6e9e7; --page-side:#f3f4f2; --page-text:#1d2a30;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --surface:#172023; --s2:#1e282c; --s3:#263236;
    --line:#33424a; --outline:#6f7d83;
    --text:#e7ecec; --text2:#b3c0c4; --text3:#8d9ba0;
    --accent:#ee7a3c; --on-accent:#170d06; --accent-text:#f59a62;
    --accent-c:#4a2412; --on-accent-c:#ffdccb;
    --primary:#e7ecec; --on-primary:#1d2a30;
    --danger:#c4302b; --on-danger:#ffffff; --ok:#6fcf97; --ok-c:#1f3a2a; --warn:#e3b341; --warn-c:#3d3012; --bad:#f2b8b5; --bad-c:#4a1d1a;
    --scrim:rgba(0,0,0,.55);
    --mica:#1b2124; --layer:#232b2e; --layer2:#1f2629; --wstroke:rgba(255,255,255,.07); --wstroke2:rgba(255,255,255,.13);
    --desk:#2a3236; --taskbar:rgba(28,33,36,.96);
    --page:#0c1012; --page-side:#141a1c; --page-text:#e7ecec;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#172023; --s2:#1e282c; --s3:#263236;
  --line:#33424a; --outline:#6f7d83;
  --text:#e7ecec; --text2:#b3c0c4; --text3:#8d9ba0;
  --accent:#ee7a3c; --on-accent:#170d06; --accent-text:#f59a62;
  --accent-c:#4a2412; --on-accent-c:#ffdccb;
  --primary:#e7ecec; --on-primary:#1d2a30;
  --danger:#c4302b; --on-danger:#ffffff; --ok:#6fcf97; --ok-c:#1f3a2a; --warn:#e3b341; --warn-c:#3d3012; --bad:#f2b8b5; --bad-c:#4a1d1a;
  --scrim:rgba(0,0,0,.55);
  --mica:#1b2124; --layer:#232b2e; --layer2:#1f2629; --wstroke:rgba(255,255,255,.07); --wstroke2:rgba(255,255,255,.13);
  --desk:#2a3236; --taskbar:rgba(28,33,36,.96);
  --page:#0c1012; --page-side:#141a1c; --page-text:#e7ecec;
  color-scheme:dark;
}

/* ---------- Mockup page chrome ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--page-text);font:14px/1.45 "Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:268px 1fr;height:100vh}
.side{background:var(--page-side);border-right:1px solid var(--line);overflow:auto;padding:16px 12px 24px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 12px}
.brand svg{width:36px;height:36px;color:var(--text)}
.brand b{font-size:18px;letter-spacing:.2px;display:block}
.brand span{font-size:12px;color:var(--text3)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;padding:0 6px 10px}
.ctl button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.ctl button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grp{margin-top:12px}
.grp h3{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin:10px 8px 4px;font-weight:600}
.grp a{display:flex;gap:8px;padding:5px 8px;border-radius:6px;color:var(--text2);text-decoration:none;font-size:13px;line-height:1.3}
.grp a:hover{background:var(--s2)}
.grp a.on{background:var(--s3);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.grp a i{font-style:normal;color:var(--text3);font-size:11px;min-width:22px;font-family:"Roboto Mono",monospace;padding-top:1px}
.stage{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.stagehead{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--page-side)}
.stagehead h1{font-size:17px;margin:0;font-weight:600}
.stagehead .crumb{font-size:12px;color:var(--text3)}
.stagehead .sp{flex:1}
.stagehead button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.stagebody{flex:1;display:flex;gap:20px;padding:18px 20px;overflow:auto;min-height:0}
.framebox{flex:1;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.fit{transform-origin:top left}
.notes{width:300px;flex:none;font-size:13px;color:var(--text2)}
.notes h4{margin:0 0 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
.notes p{margin:0 0 14px}
.notes ul{margin:0 0 14px;padding-left:18px}
.notes li{margin:2px 0}
.notes .go{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:12px;border:1px solid var(--line);font-size:12px;color:var(--text);text-decoration:none}
.notes .go:hover{border-color:var(--accent)}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.side{max-height:40vh}.stagebody{flex-direction:column;padding:16px}.notes{width:auto}}
body.hot [data-go]{outline:2px dashed var(--accent);outline-offset:-2px}
[data-go]{cursor:pointer}

/* Capture mode (?capture): only the device frame, at scale 1 and without page chrome or frame
   shadow, so a headless browser window the size of the frame yields an exact image. Used by
   `cargo xtask mockups`. Normal viewing is unchanged. */
html.capture,html.capture body{height:auto;background:transparent;overflow:hidden}
html.capture .side,html.capture .stagehead,html.capture .notes{display:none}
html.capture .app,html.capture .stage,html.capture .stagebody,html.capture .framebox{display:block;height:auto;padding:0;overflow:visible;min-width:0}
html.capture .fit{transform:none}
html.capture .phone,html.capture .tablet,html.capture .laptop{box-shadow:none}
html.capture *,html.capture *::before,html.capture *::after{animation:none!important;transition:none!important;caret-color:transparent}

/* ---------- Shared bits ---------- */
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s{width:18px;height:18px}.ic.xs{width:14px;height:14px;stroke-width:2}.ic.l{width:32px;height:32px}.ic.xl{width:48px;height:48px;stroke-width:1.5}
.mono{font-family:"Roboto Mono",ui-monospace,Consolas,monospace}
.tnum{font-variant-numeric:tabular-nums}
.rail{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3);white-space:nowrap}
.rail svg{width:58px;height:18px;flex:none}

/* ---------- Device frames ---------- */
.phone{width:412px;height:915px;border-radius:38px;border:9px solid #0b0f10;background:var(--bg);color:var(--text);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #2a3236,0 24px 60px rgba(0,0,0,.25);font:14px/1.43 "Roboto Flex",Roboto,system-ui,sans-serif}
.tablet{width:1280px;height:800px;border-radius:28px;border:12px solid #0b0f10;background:var(--bg);color:var(--text);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #2a3236,0 24px 60px rgba(0,0,0,.25);font:14px/1.43 "Roboto Flex",Roboto,system-ui,sans-serif}
.laptop{width:960px;height:640px;border-radius:10px;border:10px solid #0b0f10;border-bottom-width:14px;background:var(--desk);color:var(--text);position:relative;overflow:hidden;box-shadow:0 0 0 1px #2a3236,0 24px 60px rgba(0,0,0,.25);font:13px/1.4 "Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif}

/* ---------- Android (Material 3) ---------- */
.sbar{height:30px;flex:none;display:flex;align-items:center;padding:0 22px 0 26px;font-size:13px;font-weight:500;gap:6px}
.sbar .sp{flex:1}.sbar .ic{width:15px;height:15px;stroke-width:2.2}
.gbar{height:22px;flex:none;display:flex;justify-content:center;align-items:center}
.gbar::after{content:"";width:108px;height:4px;border-radius:2px;background:var(--text);opacity:.55}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow:hidden;min-height:0;position:relative}
.tb{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px}
.tb .tt{flex:1;min-width:0;padding-left:6px}
.tb .tt b{display:block;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tb .tt span{display:block;font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none;position:relative}
.ib:hover{background:var(--s2)}
.ib .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:4px;background:var(--accent)}
.lt{padding:6px 20px 10px;font-size:30px;line-height:1.2;font-weight:450;letter-spacing:-.2px}
.sub{padding:0 20px 8px;color:var(--text3);font-size:13px}
.sec{padding:16px 20px 6px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.1px}
.li{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 20px;min-height:64px;position:relative}
.li .bd{flex:1;min-width:0}
.li .l1{font-size:15.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .l2{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .l3{font-size:12.5px;color:var(--text3);margin-top:2px}
.li.dim{opacity:.48}
.li.selrow{background:var(--accent-c)}
.li+.li.div{border-top:1px solid var(--line)}
.tile{width:42px;height:42px;border-radius:10px;background:var(--s2);color:var(--text2);display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.tile.fd{background:var(--s3);color:var(--text)}
.tile .badge{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);font-size:13px;color:var(--text2);white-space:nowrap;background:transparent}
.chip.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px;gap:4px}
.chip.fill{background:var(--s3);border-color:transparent;color:var(--text)}
.chip.sel{background:var(--accent-c);border-color:transparent;color:var(--on-accent-c)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.ok{border-color:transparent;background:var(--ok-c);color:var(--ok)}
.chip.off{opacity:.45;text-decoration:line-through}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;padding:4px 20px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:22px;background:var(--primary);color:var(--on-primary);font-weight:500;font-size:14.5px;border:0;white-space:nowrap}
.btn.ton{background:var(--s3);color:var(--text)}
.btn.out{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.txt{background:transparent;color:var(--text);padding:0 12px}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.bad{background:var(--danger);color:var(--on-danger)}
.btn.blk{display:flex;width:100%}
.btn[disabled]{opacity:.38}
.fab{position:absolute;right:16px;bottom:96px;height:56px;border-radius:16px;padding:0 20px;display:flex;gap:10px;align-items:center;background:var(--primary);color:var(--on-primary);font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.nav{height:80px;flex:none;display:flex;background:var(--s2);padding-top:12px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--text2);text-decoration:none}
.nav a .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative}
.nav a.on{color:var(--text);font-weight:600}
.nav a.on .pill{background:var(--accent-c);color:var(--on-accent-c)}
.nav a .pill .dot{position:absolute;top:3px;right:14px;width:8px;height:8px;border-radius:4px;background:var(--accent)}
.banner{display:flex;gap:12px;padding:12px 16px;margin:4px 16px 8px;border-radius:12px;background:var(--s2);font-size:13.5px;align-items:flex-start;color:var(--text)}
.banner b{display:block;font-weight:600;margin-bottom:1px}
.banner .ic{margin-top:1px}
.banner.warn{background:var(--warn-c);box-shadow:inset 3px 0 0 var(--warn)}.banner.warn>.ic{color:var(--warn)}
.banner.bad{background:var(--bad-c);box-shadow:inset 3px 0 0 var(--bad)}.banner.bad>.ic{color:var(--bad)}
.banner.ok{background:var(--ok-c)}.banner.ok>.ic{color:var(--ok)}
.banner.live{background:var(--accent);color:var(--on-accent)}
.banner .act{margin-top:6px;font-weight:600;color:var(--text)}
.prog{height:4px;border-radius:2px;background:var(--s3);overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:2px}
.prog.ind i{width:35%;animation:ind 1.6s ease-in-out infinite}
@keyframes ind{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.prog.ind i{animation:none;left:30%}}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;z-index:6;padding:8px 0 22px}
.bsheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline);margin:6px auto 12px;opacity:.6}
.dlg{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:var(--s2);border-radius:28px;padding:24px;z-index:6}
.dlg h2{margin:12px 0 10px;font-size:22px;font-weight:450;line-height:1.25}
.dlg p{margin:0 0 12px;color:var(--text2);font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--outline);flex:none;position:relative}
.radio.on{border-color:var(--accent)}.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.cbx{width:20px;height:20px;border-radius:4px;border:2px solid var(--outline);flex:none;display:flex;align-items:center;justify-content:center}
.cbx.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--s3);box-shadow:inset 0 0 0 2px var(--outline);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:8px;background:var(--outline)}
.sw.on{background:var(--primary);box-shadow:none}.sw.on::after{left:24px;top:4px;width:24px;height:24px;border-radius:12px;background:var(--on-primary)}
.field{margin:8px 20px;border:1px solid var(--outline);border-radius:6px;padding:8px 14px 10px;position:relative}
.field.foc{border:2px solid var(--primary)}
.field label{position:absolute;top:-9px;left:10px;background:var(--bg);padding:0 4px;font-size:12px;color:var(--text2)}
.field .v{font-size:16px}
.help{padding:2px 34px 8px;font-size:12.5px;color:var(--text3)}
.sas{display:flex;justify-content:center;gap:18px;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:500;font-size:52px;letter-spacing:4px;line-height:1;color:var(--text)}
.sas span{padding:14px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.pairid{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 20px 4px}
.pairid .who{display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;text-align:center}
.pairid .who .tile{width:56px;height:56px;border-radius:16px}
.pairid .who b{font-size:14.5px;font-weight:600}.pairid .who span{font-size:12px;color:var(--text3)}
.pairid .link{flex:1;border-top:2px dashed var(--outline);position:relative;top:-16px}
.immersive{background:#0b0e0f;color:#e9eeee}
.immersive .ib{color:#e9eeee}
.immersive .gbar::after{background:#e9eeee}
.ovbar{position:absolute;left:0;right:0;top:0;z-index:3;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.kbar{flex:none;background:var(--s2);padding:6px 6px 4px;border-top:1px solid var(--line)}
.krow{display:flex;gap:5px;margin-bottom:5px}
.key{flex:1;height:38px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--text);box-shadow:0 1px 0 var(--line);white-space:nowrap;padding:0 4px}
.key.on{background:var(--accent);color:var(--on-accent)}
.key.w2{flex:1.6}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:18px;overflow:hidden;height:32px}
.seg span{display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12.5px;color:var(--text2)}
.seg span+span{border-left:1px solid var(--outline)}
.seg span.on{background:var(--accent-c);color:var(--on-accent-c);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent-text)}
.live::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.status::before{content:"";width:8px;height:8px;border-radius:4px;background:currentColor}
.status.on{color:var(--ok)}.status.off{color:var(--text3)}.status.off::before{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
.status.warn{color:var(--warn)}
/* action rows in the file sheet */
.act-row{display:flex;gap:14px;align-items:flex-start;margin:0 16px 8px;padding:14px 14px 12px;border-radius:16px;background:var(--s2);position:relative}
.act-row .ai{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.act-row .bd{flex:1;min-width:0}
.act-row .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.act-row .h{font-size:13px;color:var(--text2);margin-top:1px}
.act-row .why{font-size:13px;color:var(--text);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.act-row.def{background:var(--accent-c);box-shadow:inset 0 0 0 2px var(--accent)}
.act-row.def .t{color:var(--on-accent-c)}
.act-row.no{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.act-row.no .t,.act-row.no .h,.act-row.no .ai{opacity:.5}
.tag{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent);color:var(--on-accent)}
.tag.n{background:var(--s3);color:var(--text2)}
.thumbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px}

/* ---------- Sample QR (not scannable: finder patterns plus seeded noise) ---------- */
function qrPath(n, seed, x0, y0, c) {
  let s = seed;
  const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  const finder = (fx, fy, x, y) => {
    const dx = x - fx;
    const dy = y - fy;
    if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
    const edge = dx === 0 || dy === 0 || dx === 6 || dy === 6;
    const core = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
    return edge || core;
  };
  let d = '';
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      let on = finder(0, 0, x, y);
      if (on === null) on = finder(n - 7, 0, x, y);
      if (on === null) on = finder(0, n - 7, x, y);
      if (on === null) {
        const nearFinder = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
        on = nearFinder ? false : rnd() > 0.52;
      }
      if (on) d += `M${(x0 + x * c).toFixed(2)} ${(y0 + y * c).toFixed(2)}h${c}v${c}h-${c}z`;
    }
  }
  return `<path d="${d}" fill="#111"/>`;

add(WH, 'h-add', 'Add a device: QR', 'laptop', hAdd, 'Pairing window: QR, three steps, manual addresses, expiry and failed-attempt count.', ['Open, waiting (shown)', 'Rate limited: bad infobar, "Close and open again to reset"', 'Expired: QR greyed, "Open again"']);
add(WH, 'h-add-approve', 'Add a device: approve', 'laptop', hAddApprove, 'The device asks to pair: identity, network login, large code, and Deny as wide as Allow.', ['Tailscale identity (shown)', 'Identity unknown', 'Shared from another tailnet', 'Tagged node refused']);
add(WH, 'h-activity', 'Activity', 'laptop', hActivity, 'The audit log in plain words, newest first, filterable.', ['Events', 'Only problems', 'Nothing yet']);
add(WH, 'h-network', 'Network', 'laptop', hNetwork, 'Where Gander listens, how each device is connected, and a connectivity check with fixes.', ['All good', 'Shields Up on', 'Firewall block rule (shown)', 'No private network: listener on loopback only, explained']);
add(WH, 'h-settings', 'Settings', 'laptop', hSettings, 'Fluent settings cards: general, streaming, listener, storage.', ['Default']);
add(WH, 'h-viewing', 'Being viewed: toast and indicator', 'laptop', hViewing, 'Unmistakable: an orange pill at the top of the screen with Stop, a toast naming the device and the file, an orange dot on the tray icon, and the yellow Windows capture border around the streamed window (kept on, per the stream launch policy).', ['Streaming (shown)', 'Browsing only: toast "Pixel 9 connected", no pill']);
add(WH, 'h-prompt', 'Stream approval prompts', 'laptop', hPrompt, 'Owner prompts: an app not yet approved, and someone at the keyboard.', ['App approval', 'Attended computer']);
add(WH, 'h-kill', 'Kill switch used', 'laptop', hKill, 'One click, no confirmation. The result is stated, and undo is "Resume now".', ['Just used (shown)', 'Paused by menu: same band without the counts']);

/* ---------- Router ---------- */
const byId = Object.fromEntries(S.map((s) => [s.id, s]));
const side = document.getElementById('side');
const THEMES = ['system', 'light', 'dark'];
function getTheme() { try { return localStorage.getItem('gander-theme') || 'system'; } catch (e) { return 'system'; } }
function setTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gander-theme', t); } catch (e) { /* storage blocked: theme still applies */ }
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === t)));
}
function buildSide() {
  const groups = [...new Set(S.map((s) => s.g))];
  let n = 0;
  side.innerHTML = `<div class="brand">${lens(36)}<div><b>Gander</b><span>UI redesign · 2026-11-02</span></div></div>
   <div class="ctl">${THEMES.map((t) => `<button type="button" data-theme-btn="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}<button type="button" id="hot" aria-pressed="false">Tap targets</button></div>
   ${groups.map((g) => `<div class="grp"><h3>${g}</h3>${S.filter((s) => s.g === g).map((s) => `<a href="#/${s.id}" data-id="${s.id}"><i>${String(++n).padStart(2, '0')}</i>${s.n}</a>`).join('')}</div>`).join('')}`;
  side.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
  document.getElementById('hot').addEventListener('click', (e) => {
    const on = document.body.classList.toggle('hot');
    e.currentTarget.setAttribute('aria-pressed', String(on));
  });
}
function current() { const id = location.hash.replace(/^#\/?/, ''); return byId[id] ? id : 'hosts'; }
const CAPTURE = new URLSearchParams(location.search).has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
function fit() {
  if (CAPTURE) return; // capture mode shows the frame at scale 1 (see the .capture rules)
  const box = document.getElementById('framebox');
  const f = document.getElementById('fit');
  const fb = document.getElementById('fitbox');
  if (!f || !f.firstElementChild) return;
  const w = f.firstElementChild.offsetWidth;
  const h = f.firstElementChild.offsetHeight;
  const ah = box.parentElement.clientHeight - 40;
  const aw = box.clientWidth;
  const sc = Math.max(0.4, Math.min(1, aw / w, ah / h));
  f.style.transform = `scale(${sc})`;
  fb.style.width = `${w * sc}px`;
  fb.style.height = `${h * sc}px`;
}
function render(id) {
  const s = byId[id];
  document.getElementById('framebox').innerHTML = `<div id="fitbox"><div class="fit" id="fit">${s.r()}</div></div>`;
  document.getElementById('title').textContent = s.n;
  document.getElementById('crumb').textContent = `${s.g} · ${{ phone: 'Pixel 9, 412 x 915 dp', tablet: 'Galaxy Tab S9, 1280 x 800 dp', laptop: 'Windows 11, 960 x 640', page: 'Reference' }[s.f]}`;
  const targets = [...new Set([...document.querySelectorAll('#fit [data-go]')].map((e) => e.dataset.go))].filter((t) => byId[t] && t !== id);
  document.getElementById('notes').innerHTML = `<h4>Purpose</h4><p>${s.purpose}</p><h4>States</h4><ul>${s.states.map((x) => `<li>${x}</li>`).join('')}</ul>${targets.length ? `<h4>Taps on this screen go to</h4><p>${targets.map((t) => `<a class="go" href="#/${t}">${byId[t].n}</a>`).join('')}</p>` : ''}<h4>Keys</h4><p>Left and right arrows step through screens. "Tap targets" outlines what is clickable.</p>`;
  side.querySelectorAll('a[data-id]').forEach((a) => a.classList.toggle('on', a.dataset.id === id));
  const on = side.querySelector('a.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  fit();
}
function step(d) {
  const i = S.findIndex((s) => s.id === current());
  location.hash = `#/${S[(i + d + S.length) % S.length].id}`;
}
document.getElementById('framebox').addEventListener('click', (e) => {
  const t = e.target.closest('[data-go]');
  if (t && byId[t.dataset.go]) location.hash = `#/${t.dataset.go}`;
});
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
window.addEventListener('hashchange', () => render(current()));
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
buildSide();
const qpTheme = new URLSearchParams(location.search).get('theme');
setTheme(THEMES.includes(qpTheme) ? qpTheme : getTheme());
render(current());

/* Manifest: open with ?capture&manifest and the screen registry plus each frame's size is written to
   the console, one "GANDER-SCREEN {json}" line per screen and a "GANDER-FONTS {json}" line. `cargo xtask
   mockups` reads them from the browser log, so the registry stays the one source of truth for sizes
   and the README. The fonts line says whether the web fonts loaded: a render without them differs. */
if (CAPTURE && new URLSearchParams(location.search).has('manifest')) {
  for (const s of S) {
    render(s.id);
    const el = document.getElementById('fit').firstElementChild;
    console.log('GANDER-SCREEN ' + JSON.stringify({ id: s.id, group: s.g, name: s.n, form: s.f, purpose: s.purpose, states: s.states, width: el.offsetWidth, height: el.offsetHeight }));
  }
  const fonts = () => {
    const faces = document.fonts ? [...document.fonts] : [];
    console.log('GANDER-FONTS ' + JSON.stringify({ faces: faces.length, loaded: faces.filter((f) => f.status === 'loaded').length }));
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fonts); else fonts();
}

/* Self-test: open with ?selftest to render every screen in both themes and report. */
if (location.search.indexOf('selftest') >= 0) {
  const out = [];
  let bad = 0;
  const bgs = {};
  for (const t of ['light', 'dark']) {
    setTheme(t);
    bgs[t] = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    for (const s of S) {
      try {
        render(s.id);
        const html = document.getElementById('fit').innerHTML;
        if (html.length < 200) { bad++; out.push(`EMPTY ${t} ${s.id}`); }
        if (/undefined|\[object Object\]|NaN/.test(html)) { bad++; out.push(`BADTEXT ${t} ${s.id}`); }
      } catch (err) {
        bad++;
        out.push(`ERROR ${t} ${s.id}: ${err.message}`);
        console.error(err);
      }
    }
  }
  if (bgs.light === bgs.dark) { bad++; out.push(`THEME-TOGGLE-NOOP ${bgs.light}`); }
  setTheme('system');
  const size = document.documentElement.outerHTML.length;
  out.unshift(`SELFTEST screens=${S.length} failures=${bad} bg.light=${bgs.light} bg.dark=${bgs.dark} domsize=${size}`);
  const pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.textContent = out.join('\n');
  document.body.appendChild(pre);
}
</script>
</body>
